name: Continuous Integration

on:
  pull_request:
    branches:
      - main
      - master
  workflow_call:

jobs:
  js-test-and-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust-components: rustfmt

      - run: npm install
      - run: deno fmt --check
      - run: deno lint
      - run: npm run type-check
      - run: npm run test

  shell-studio-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: npm install
      - name: Install pinned Chromium
        run: npx playwright install chromium
      - run: npm run studio:build
      - run: npm run studio:test

  rust-linter:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node: false
          deno: false

      - name: Format
        run: |-
          rustup component add rustfmt
          cargo fmt -- --check

      - name: Linter
        run: |-
          rustup component add clippy
          cargo clippy --locked --all-targets -- -D warnings

  rust-test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node: false
          deno: false
          cache-key-prefix: rust-test

      - name: Agent OS M01 harness isolation
        run: cargo test --locked --package seelen-ui --bin seelen-ui agent_os

      - run: cargo test --locked --verbose
